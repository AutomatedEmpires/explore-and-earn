eat(2,1fr);gap:8px;animation:enter .24s ease both}.drawer .navbtn{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.1)}.modal{place-items:center;padding:20px}.modal.open{display:grid}.modalCard{width:min(100%,720px);border-radius:34px;padding:20px;border:1px solid rgba(255,255,255,.18);background:radial-gradient(circle at 20% 0,rgba(57,245,158,.16),transparent 36%),rgba(6,18,15,.94);box-shadow:var(--shadow);animation:enter .25s ease both}.modalHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.modalHead h2{margin:8px 0 0;font-size:2rem;line-height:.95;letter-spacing:-.065em}.x{width:42px;height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:white;font-size:1.2rem}.bench{position:fixed;z-index:80;right:18px;bottom:18px;display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:999px;background:rgba(44,18,74,.88);border:1px solid rgba(235,78,255,.65);box-shadow:0 18px 54px rgba(0,0,0,.32);color:#f4d7ff;font-size:.8rem;font-weight:950}.bench button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.1);color:#f4d7ff;border-radius:999px;min-height:28px;padding:0 10px;font-weight:950}.bench button.active{background:linear-gradient(135deg,#e64fff,#7c55ff);border-color:transparent;color:white}@media(max-width:1180px){:root{--side:246px}.four,.routegrid{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:repeat(2,1fr)}.col{min-height:auto}.inbox{grid-template-columns:1fr}}@media(max-width:900px){.app{display:block;padding-bottom:96px}.sidebar,.topbar{display:none}.mobileTop{position:sticky;top:0;z-index:60;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.12);background:rgba(6,18,15,.72);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;gap:10px}.mobileBottom{position:fixed;z-index:70;left:10px;right:10px;bottom:10px;padding:8px;border-radius:28px;background:rgba(6,18,15,.8);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 70px rgba(0,0,0,.32);display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.mnav{border:0;background:transparent;color:rgba(248,255,249,.62);border-radius:20px;padding:8px 4px;display:grid;place-items:center;gap:3px;font-size:.68rem;font-weight:850}.mnav span{font-size:1.18rem;line-height:1}.mnav.active{background:linear-gradient(135deg,var(--green),var(--gold));color:#071b12}.content{padding:14px}.hero{min-height:560px;padding:22px;border-radius:34px}.floatKpi{left:18px;right:18px;bottom:18px;width:auto}.two,.three,.four,.split,.form,.routegrid{grid-template-columns:1fr}.listing{grid-template-columns:1fr}.photo{height:170px}.stack{flex-direction:row;align-items:center;justify-content:space-between}.pipeline{grid-template-columns:1fr}.profileCard{grid-template-columns:1fr;align-items:start}.bench{display:none}}@media(max-width:560px){.hero h1{font-size:3.35rem}.floatKpi{grid-template-columns:1fr}.hero{min-height:650px}.mobileTop .brand{min-height:54px;padding:8px;border-radius:20px}.mark{width:36px;height:36px;border-radius:14px}.brand strong{font-size:.98rem}.brand span{display:none}.drawerPanel{grid-template-columns:1fr}.bubble{max-width:88%}.chart{gap:7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<div class="mobileTop"><div class="brand"><div class="mark">E</div><div><strong>Explore&Earn</strong><span><i class="dot"></i> Host OS</span></div></div><button class="primary" data-action="listing">+ Listing</button></div>
<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">E</div><div><strong>Explore&Earn</strong><span><i class="dot"></i> Host OS</span></div></div><div class="host"><span class="chip">Enterprise Host</span><h2>Greenfield Family Farm</h2></div><div class="nav" id="desktopNav"></div><div class="foot"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px"><div><strong>Boost capacity</strong><div style="color:rgba(248,255,249,.48);font-size:.76rem;margin-top:3px">8 of 12 premium slots used</div></div><span class="badge">76%</span></div><div class="meter"><span></span></div></div></aside><main><header class="topbar"><div class="search"><input id="search" placeholder="Search applicants, listings, messages, invites..." /></div><div class="actions"><button class="btn" data-route="analytics">Insights</button><button class="icon" data-route="messages">💬</button><button class="icon">🔔</button><button class="primary" data-action="listing">+ New listing</button></div></header><section class="content"><div class="view active" id="overview"></div><div class="view" id="listings"></div><div class="view" id="applicants"></div><div class="view" id="invites"></div><div class="view" id="messages"></div><div class="view" id="profile"></div><div class="view" id="analytics"></div><div class="view" id="settings"></div></section></main></div>
<nav class="mobileBottom" id="mobileNav"></nav><div class="drawer" id="drawer"><div class="drawerPanel" id="drawerPanel"></div></div><div class="bench"><span>DEV BENCH</span><button data-route="overview" class="active">Overview</button><button data-route="listings">Listings</button><button data-route="applicants">Applicants</button><button data-route="profile">All surfaces →</button></div><div class="modal" id="modal"><div class="modalCard"><div class="modalHead"><div><span class="chip">Prototype action</span><h2 id="modalTitle">Create boosted listing</h2></div><button class="x" id="close">×</button></div><div id="modalBody"></div></div></div>
<script>
const routes=[{id:'overview',label:'Overview',icon:'⌁',badge:'Live',sub:'Command center'},{id:'listings',label:'Listings',icon:'🎯',badge:'2',sub:'Posts + boosts'},{id:'applicants',label:'Applicants',icon:'🔥',badge:'17',sub:'Pipeline'},{id:'invites',label:'Invites',icon:'📣',badge:'8',sub:'Outbound recruiting'},{id:'messages',label:'Messages',icon:'💬',badge:'5',sub:'Threads'},{id:'profile',label:'Profile',icon:'🧍',badge:'91%',sub:'Public host page'},{id:'analytics',label:'Analytics',icon:'◷',badge:'↑',sub:'Performance'},{id:'settings',label:'Settings',icon:'⚙',badge:'',sub:'Plan + team'}];
const listings=[{title:'Farm Stay Operations Assistant',loc:'Coeur d’Alene region • Housing available',pay:'$21–$26/hr',status:'live',img:'https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=900&q=80',tags:['Seasonal','Housing','Hospitality','Boosted'],apps:12,match:91},{title:'Harvest Crew Lead',loc:'North Idaho • August–October',pay:'$24–$30/hr',status:'live',img:'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=900&q=80',tags:['Farm','Leadership','Outdoor','Urgent'],apps:5,match:86},{title:'Ranch Maintenance Tech',loc:'Draft • Needs compensation range',pay:'Draft',status:'draft',img:'https://images.unsplash.com/photo-1516937941344-00b4e0337589?auto=format&fit=crop&w=900&q=80',tags:['Maintenance','Tools','Housing'],apps:0,match:0}];
const apps=[['Ava Brooks','AB','Farm Stay Operations',94,'New',['Hospitality','Ready now','Housing'],''],['Miles Carter','MC','Harvest Crew Lead',88,'Screen',['Outdoor','Leadership','1 month'],'alt'],['Jade Kim','JK','Farm Stay Operations',91,'Interview',['Guest services','Seasonal','Remote'],'coral'],['Noah Reed','NR','Maintenance Tech',84,'Offer',['Tools','Diesel','Housing'],'ghost'],['Sofia Lane','SL','Harvest Crew Lead',79,'Hired',['Farm','Equipment','3 months'],'alt']];
const msgs=[['Ava Brooks','AB','I can arrive May 18 if housing is confirmed.','8m',true],['Miles Carter','MC','Can we schedule the crew-lead interview this week?','1h',false],['Jade Kim','JK','Thanks, I uploaded my updated resume.','4h',false],['Noah Reed','NR','I have maintenance and equipment experience.','Yesterday',false]];
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);function navItem(r,cls=''){return `<button class="navbtn ${cls}" data-route="${r.id}"><span class="ico">${r.icon}</span><span><strong>${r.label}</strong><small>${r.sub}</small></span>${r.badge?`<span class="badge">${r.badge}</span>`:'<span></span>'}</button>`}function tags(a){return `<div class="tags">${a.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`}function applicant(a){return `<div class="candidate"><div class="person"><div class="avatar ${a[6]}">${a[1]}</div><div><strong>${a[0]}</strong><span>${a[2]}</span></div></div>${tags(a[5])}<div class="line" style="--w:${a[3]}%"><span></span></div></div>`}function listing(l){return `<article class="listing"><div class="photo" style="background-image:url('${l.img}')"></div><div><span class="pill ${l.status==='live'?'live':'draft'}">${l.status==='live'?'● Live boosted':'○ Draft'}</span><h3>${l.title}</h3><p>${l.loc}</p>${tags(l.tags)}</div><div class="stack"><strong style="font-size:1.25rem;letter-spacing:-.05em">${l.pay}</strong><span style="color:rgba(248,255,249,.55);font-size:.86rem">${l.apps} applicants</span><button class="small green" data-action="listing">Edit</button></div></article>`}function metric(label,val,tr,bars){return `<article class="card metric"><div class="mtop"><span>${label}</span><span class="trend">${tr}</span></div><div><div class="num">${val}</div><div class="spark">${bars.map((h,i)=>`<i style="height:${h}%;animation-delay:${i*.05}s"></i>`).join('')}</div></div></article>`}function title(k,h,p,btn=''){return `<div class="section"><div><span class="chip">${k}</span><h2>${h}</h2><p>${p}</p></div>${btn}</div>`}function board(){return `<div class="hero"><span class="chip"><i class="dot"></i> Host dashboard redesign</span><h1>Run your hiring like a <span class="grad">premium travel campaign.</span></h1><p>This host OS reframes listings, applicants, invites, messages, profile, analytics, and billing into one cinematic control center. Every role becomes a promoted destination, not a flat database row.</p><div class="heroBtns"><button class="primary" data-action="listing">Create boosted listing</button><button class="btn" data-route="applicants">Review applicants</button><button class="btn" data-route="analytics">Open analytics</button></div><div class="floatKpi"><div><strong>2</strong><span>active listings</span></div><div><strong>17</strong><span>applicants</span></div><div><strong>91%</strong><span>profile strength</span></div></div></div>`}
function overview(){return `${board()}<div class="grid four" style="margin-top:16px">${metric('Listing views','8.4k','↑ 24%',[35,56,44,70,66,88,74])}${metric('Apply rate','12.8%','↑ 8%',[30,38,50,42,62,68,73])}${metric('Avg. match','86%','Strong',[74,79,70,82,86,89,91])}${metric('Time to reply','3.2h','Fast',[82,76,68,54,46,38,32])}</div>${title('Priority workbench','Operational dashboard first.','High-value actions first: applicants needing review, listings losing momentum, and messages that can convert.')}<div class="grid split"><div class="card pad"><div class="head"><div><h3>Applicant pipeline</h3><p>Kanban-style surface for production.</p></div><button class="small" data-route="applicants">Open pipeline</button></div><div class="pipeline">${['New','Screen','Interview','Offer','Hired'].map(s=>`<div class="col"><h4>${s}<span>${apps.filter(a=>a[4]===s).length}</span></h4>${apps.filter(a=>a[4]===s).map(applicant).join('')||'<div class="candidate" style="opacity:.52">No candidates</div>'}</div>`).join('')}</div></div><div class="grid"><div class="card pad"><div class="head"><div><h3>Conversion radar</h3><p>Profile, listings, response time, boost inventory.</p></div><span class="chip">Healthy</span></div><div class="radial"><strong>78%</strong></div>${tags(['Add 3 photos','Reply to Ava','Boost Harvest Crew','Finish draft'])}</div><div class="card paper pad"><div class="head"><div><h3>Next best action</h3><p>Invite 6 high-match seekers for Farm Stay Operations. Lead quality is strong, but lead volume is below plan.</p></div></div><button class="small dark" data-route="invites">Open invite builder →</button></div></div></div>${title('All host surfaces','Route map.','Every host area is browsable from this prototype.')}<div class="routegrid">${routes.slice(1).map(r=>`<article class="routecard" data-route="${r.id}"><span class="ico">${r.icon}</span><h3>${r.label}</h3><p>${r.sub}. Click to browse this dashboard surface.</p></article>`).join('')}</div>`}
function listingsView(){return `${title('Listings command','Listings should sell the destination and the job.','Active, draft, boosted, expired, and underperforming roles live here.','<button class="primary" data-action="listing">+ Create listing</button>')}<div class="grid four">${metric('Active','2','Live',[40,52,57,60,68,72,80])}${metric('Drafts','1','Finish',[24,22,28,26,32,30,36])}${metric('Boosted slots','8/12','76%',[62,68,66,74,78,82,76])}${metric('Applications','17','↑ 14%',[30,46,42,58,64,70,76])}</div>${title('Listing inventory','Live roles first.','Reordered around operational urgency: live boosted roles, drafts, and roles that need intervention.')}<div class="grid">${listings.map(listing).join('')}</div>${title('Boost strategy','Homepage exposure logic.','Paid boosted slots first. Empty premium inventory falls back Enterprise → Pro → Starter, with visual distinction.')}<div class="grid three"><div class="card pad"><div class="head"><h3>Enterprise priority</h3><span class="chip">First fill</span></div><p style="color:var(--mut);line-height:1.48">Show paid Enterprise boosted cards first. Rotate by category and match relevance.</p>${tags(['Homepage','Matched feed','Top carousel'])}</div><div class="card pad"><div class="head"><h3>Pro fallback</h3><span class="chip">Second</span></div><p style="color:var(--mut);line-height:1.48">Fill empty premium slots with Pro listings only when Enterprise inventory is insufficient.</p>${tags(['Weighted','Category fit','Location fit'])}</div><div class="card pad"><div class="head"><h3>Starter fallback</h3><span class="chip">Last</span></div><p style="color:var(--mut);line-height:1.48">Starter can backfill unsold slots, but should not visually compete with paid boost inventory.</p>${tags(['Controlled','Lower weight','No premium badge'])}</div></div>`}
function applicantsView(){return `${title('Applicant command','Make candidates feel like premium match cards.','Hosts should know who to review, why they match, what they want, and what action comes next.','<button class="primary" data-action="invite">Invite seekers</button>')}<div class="grid four">${metric('New','7','Review',[30,44,62,56,74,66,82])}${metric('Interviews','3','Today',[20,30,42,56,48,60,64])}${metric('Offers','2','Open',[16,24,30,38,42,48,58])}${metric('Avg. fit','86%','Strong',[70,76,72,82,84,88,86])}</div>${title('Hiring pipeline','Applicant kanban.','Match rationale, timeline, category, housing needs, and fast actions stay visible.')}<div class="card pad"><div class="pipeline">${['New','Screen','Interview','Offer','Hired'].map(s=>`<div class="col"><h4>${s}<span>${apps.filter(a=>a[4]===s).length}</span></h4>${apps.filter(a=>a[4]===s).map(a=>`${applicant(a)}<div style="display:flex;gap:7px;margin:-2px 0 10px"><button class="small">View</button><button class="small green">Advance</button></div>`).join('')||'<div class="candidate" style="opacity:.52">No candidates</div>'}</div>`).join('')}</div></div>${title('Recommended seekers','Outbound talent discovery.','Keep the role warm by inviting strong matches before the applicant pool goes cold.')}<div class="grid three">${[['EL','Eli Lawson','Maintenance tech • ready now',92,['Tools','Housing','Outdoor']],['PR','Priya Raman','Hospitality lead • 1 month',89,['Guest service','Remote','Seasonal']],['DT','Dylan Torres','Farm crew • ready now',87,['Farm','Equipment','Travel']]].map(s=>`<div class="card pad"><div class="person"><div class="avatar">${s[0]}</div><div><strong>${s[1]}</strong><span>${s[2]}</span></div></div>${tags(s[4])}<div class="line" style="--w:${s[3]}%"><span></span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><strong>${s[3]}% match</strong><button class="small green">Invite</button></div></div>`).join('')}</div>`}
function invitesView(){return `${title('Outbound recruiting','Invites should feel targeted, not spammy.','Build campaigns from role fit, timeline, category preference, travel interest, and profile strength.','<button class="primary" data-action="invite">Build campaign</button>')}<div class="grid three">${metric('Sent','48','This month',[40,58,46,70,64,76,82])}${metric('Open rate','61%','↑ 12%',[30,42,50,62,66,70,78])}${metric('Invite-to-apply','18%','Good',[20,30,34,42,50,48,58])}</div><div class="grid split" style="margin-top:16px"><div class="card pad"><div class="head"><div><h3>Campaign builder</h3><p>Select role, audience, message angle, and boost priority.</p></div><span class="chip">Smart targeting</span></div><div class="form"><div class="field"><label>Role</label><select><option>Farm Stay Operations Assistant</option><option>Harvest Crew Lead</option></select></div><div class="field"><label>Audience</label><select><option>90%+ match seekers</option><option>Ready now seekers</option></select></div><div class="field"><label>Timeline</label><select><option>Ready now to 1 month</option><option>1–3 months</option></select></div><div class="field"><label>Volume</label><select><option>20 high-quality invites</option><option>50 broad invites</option></select></div><div class="field full"><label>Message</label><textarea>We think you could be a strong fit for our seasonal farm stay operations role. Housing is available, the work is guest-facing, and your timeline appears aligned.</textarea></div></div><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="primary">Preview campaign</button><button class="btn">Save draft</button></div></div><div class="grid">${[['Farm Stay invite batch','22 sent • 14 opened • 5 applied','hot',['91% avg match','Housing angle','Ready now']],['Harvest crew outreach','16 sent • 9 opened • 2 applied','live',['Farm category','Outdoor','August start']],['Maintenance tech draft','Not sent yet','draft',['Needs pay range','Tools','Housing']]].map(i=>`<div class="invite"><div class="head" style="margin-bottom:8px"><div><h3>${i[0]}</h3><p>${i[1]}</p></div><span class="pill ${i[2]}">${i[2]}</span></div>${tags(i[3])}</div>`).join('')}</div></div>`}
function messagesView(){return `${title('Message center','Conversations tied directly to hiring outcomes.','Each thread shows applicant stage, matched role, timeline, and recommended next action.','<button class="primary">Compose</button>')}<div class="inbox"><div class="card pad"><div class="head"><h3>Threads</h3><span class="chip">5 unread</span></div>${msgs.map(m=>`<div class="msg" style="${m[4]?'background:rgba(57,245,158,.1);border-color:rgba(57,245,158,.22)':''}"><div class="person"><div class="avatar ${m[1]==='MC'?'alt':m[1]==='JK'?'coral':''}">${m[1]}</div><div><strong>${m[0]}</strong><span>${m[2]}</span></div><span style="margin-left:auto;color:rgba(248,255,249,.48);font-size:.76rem">${m[3]}</span></div></div>`).join('')}</div><div class="card pad thread"><div class="head"><div class="person"><div class="avatar">AB</div><div><h3>Ava Brooks</h3><p>Farm Stay Operations • 94% match • Ready now</p></div></div><div class="heroBtns"><button class="small">View profile</button><button class="small green">Schedule</button></div></div><div class="bubbles"><div class="bubble">Hi, I saw the farm stay role. I have guest service experience and can relocate quickly.</div><div class="bubble me">Your profile looks like a strong fit. Housing is available, and the role starts in May.</div><div class="bubble">I can arrive May 18 if housing is confirmed. Is there a weekend rotation?</div><div class="bubble me">Yes. The schedule is 5 days on, 2 days off. Weekend rotation is shared across the team.</div></div><div class="composer"><input placeholder="Write a reply..."/><button class="primary">Send</button></div></div></div>`}
function profileView(){return `<div class="profileHero"><span class="chip">Public host profile</span><div class="profileCard"><div><h1>Greenfield Family Farm</h1><p>A seasonal farm-stay host offering hands-on work, housing options, guest-facing operations, and a grounded rural experience near North Idaho.</p>${tags(['Farm stay','Housing','Seasonal','Guest services','Outdoor work'])}</div><button class="primary">Edit public profile</button></div></div><div class="grid three" style="margin-top:16px">${metric('Profile strength','91%','Excellent',[74,80,82,86,88,90,91])}${metric('Host rating','4.8','Trusted',[70,78,76,84,90,86,92])}${metric('Seeker saves','342','↑ 19%',[34,48,56,60,72,80,88])}</div>${title('Profile editor','Make the host story convert.','The public profile should be visual, credible, specific, and conversion-oriented.')}<div class="grid split"><div class="card pad"><div class="form"><div class="field"><label>Host name</label><input value="Greenfield Family Farm"/></div><div class="field"><label>Host type</label><select><option>Farm / ranch</option><option>Lodge</option></select></div><div class="field"><label>Location</label><input value="North Idaho"/></div><div class="field"><label>Housing</label><select><option>Available</option><option>Case-by-case</option></select></div><div class="field full"><label>Public bio</label><textarea>A seasonal farm-stay operation with guest services, field work, lodging support, and outdoor work opportunities.</textarea></div></div><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="primary">Save profile</button><button class="btn">Preview seeker view</button></div></div><div class="card paper pad"><div class="head"><div><h3>Profile checklist</h3><p>What makes a host profile convert.</p></div><span class="chip">91%</span></div>${['Add 6+ authentic workplace photos','Describe housing clearly','Show pay ranges on every listing','Explain the daily rhythm','Add team expectations and culture'].map(x=>`<div class="settingsrow" style="background:rgba(20,33,29,.045);border-color:rgba(20,33,29,.09)"><div><strong>${x}</strong><div style="color:rgba(20,33,29,.54);font-size:.86rem;margin-top:3px">Recommended for seeker trust.</div></div><span style="color:#0a6b42;font-weight:950">✓</span></div>`).join('')}</div></div>`}
function analyticsView(){return `${title('Analytics','Performance should tell hosts what to do next.','Not just charts. Show why applications are rising or falling and which levers improve hiring outcomes.','<button class="primary">Export report</button>')}<div class="grid four">${metric('Views','8.4k','↑ 24%',[35,56,44,70,66,88,74])}${metric('Saves','342','↑ 19%',[34,48,56,60,72,80,88])}${metric('Applicants','17','↑ 14%',[30,46,42,58,64,70,76])}${metric('Hires','1','On pace',[10,18,22,28,32,34,38])}</div><div class="grid split" style="margin-top:16px"><div class="card pad"><div class="head"><div><h3>Applications by day</h3><p>Animated chart placeholder for production analytics.</p></div><span class="chip">Last 7 days</span></div><div class="chart">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div class="bar" style="--h:${[36,48,42,68,76,58,82][i]}%" data-label="${d}"></div>`).join('')}</div></div><div class="card pad"><div class="head"><div><h3>Conversion score</h3><p>Listing quality, profile quality, response speed, boost allocation.</p></div><span class="chip">Healthy</span></div><div class="radial"><strong>78%</strong></div>${tags(['Improve draft','Add housing photo','Reply under 4h','Raise pay visibility'])}</div></div>${title('Role-level diagnosis','Performance by listing.','Each listing gets a growth diagnosis, not just raw numbers.')}<div class="grid">${listings.slice(0,2).map(l=>`<div class="listing"><div class="photo" style="background-image:url('${l.img}')"></div><div><h3>${l.title}</h3><p>${l.apps} applicants • ${l.match}% avg match • ${l.pay}</p>${tags(['Strong image','Good pay clarity',l.title.includes('Harvest')?'Needs more saves':'High conversion'])}</div><div class="stack"><span class="pill live">Optimizable</span><button class="small green">Improve</button></div></div>`).join('')}</div>`}
function settingsView(){return `${title('Settings, plan, team','Billing and controls without killing the product vibe.','Keep settings clean, trustworthy, and operationally obvious.','<button class="primary">Upgrade plan</button>')}<div class="grid split"><div class="card pad"><div class="head"><div><h3>Plan</h3><p>Enterprise host plan with premium homepage inventory.</p></div><span class="chip">Enterprise</span></div>${[['Boosted homepage slots','8 of 12 slots currently allocated.','Manage'],['Billing','Next invoice: July 1, 2026.','Open'],['Team seats','3 of 5 seats used.','Invite']].map(x=>`<div class="settingsrow"><div><strong>${x[0]}</strong><div style="color:rgba(248,255,249,.54);font-size:.86rem;margin-top:3px">${x[1]}</div></div><button class="small green">${x[2]}</button></div>`).join('')}</div><div class="card pad"><div class="head"><div><h3>Controls</h3><p>Operational preferences for host workflow.</p></div></div>${[['Auto-reply to new applicants',1],['Notify me for 90%+ matches',1],['Require pay range on public listings',1],['Show housing badge publicly',1],['Allow seekers to message before applying',0]].map(s=>`<div class="settingsrow"><div><strong>${s[0]}</strong><div style="color:rgba(248,255,249,.54);font-size:.86rem;margin-top:3px">Dashboard-level preference.</div></div><button class="toggle ${s[1]?'on':''}"></button></div>`).join('')}</div></div>${title('Team','Role-based permissions.','Owner, hiring manager, recruiter, and viewer access should be explicit.')}<div class="grid three">${[['WF','Wendy Foster','Owner • full access'],['GM','Garrett Miller','Hiring manager • applicants + messages'],['LS','Lena Stone','Viewer • analytics only']].map(t=>`<div class="card pad"><div class="person"><div class="avatar alt">${t[0]}</div><div><strong>${t[1]}</strong><span>${t[2]}</span></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="small">Edit</button><button class="small">Remove</button></div></div>`).join('')}</div>`}
const views={overview, listings:listingsView, applicants:applicantsView, invites:invitesView, messages:messagesView, profile:profileView, analytics:analyticsView, settings:settingsView};
function render(){const desktop=$('#desktopNav');desktop.innerHTML=`<div class="label">Command</div>${navItem(routes[0],'active')}<div class="label">Manage</div>${routes.slice(1,4).map(navItem).join('')}<div class="label">Connect</div>${routes.slice(4,6).map(navItem).join('')}<div class="label">Insights & Settings</div>${routes.slice(6).map(navItem).join('')}`;$('#mobileNav').innerHTML=[routes[0],routes[1],routes[2],routes[4],{id:'more',label:'More',icon:'•••'}].map((r,i)=>`<button class="mnav ${i===0?'active':''}" data-route="${r.id}"><span>${r.icon}</span>${r.label}</button>`).join('');$('#drawerPanel').innerHTML=routes.slice(3).map(navItem).join('');Object.entries(views).forEach(([id,fn])=>$('#'+id).innerHTML=fn())}
function route(id){if(id==='more'){ $('#drawer').classList.add('open');return}if(!views[id])id='overview';$$('.view').forEach(v=>v.classList.toggle('active',v.id===id));$$('[data-route]').forEach(el=>{if(el.classList.contains('navbtn')||el.classList.contains('mnav')||el.parentElement?.classList.contains('bench'))el.classList.toggle('active',el.dataset.route===id)});$('#drawer').classList.remove('open');location.hash=id;scrollTo({top:0,behavior:'smooth'})}
function openModal(type){$('#modalTitle').textContent=type==='invite'?'Build invite campaign':'Create boosted listing';$('#modalBody').innerHTML=type==='invite'?`<p style="color:var(--mut);line-height:1.5;margin-top:0">Select a role and target high-match seekers based on timeline, category interest, profile quality, and housing preference.</p><div class="grid three">${['90%+ matches','Ready now','Farm category'].map(x=>`<button class="card pad" style="color:white;text-align:left"><strong>${x}</strong><p style="color:var(--mut)">Recommended audience</p></button>`).join('')}</div><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="primary">Create campaign</button><button class="btn">Save draft</button></div>`:`<div class="form"><div class="field"><label>Title</label><input value="Seasonal Farm Stay Operations Assistant"/></div><div class="field"><label>Pay range</label><input value="$21–$26/hr"/></div><div class="field"><label>Category</label><select><option>Farm / seasonal</option><option>Hospitality</option><option>Maintenance</option></select></div><div class="field"><label>Boost tier</label><select><option>Enterprise homepage boosted</option><option>Pro featured</option><option>Starter fallback</option></select></div><div class="field full"><label>Role story</label><textarea>This role supports guest operations, farm-stay logistics, light grounds work, and the daily rhythm of a seasonal farm experience.</textarea></div></div><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="primary">Save listing</button><button class="btn">Preview card</button></div>`;$('#modal').classList.add('open')}
render();document.body.addEventListener('click',e=>{const r=e.target.closest('[data-route]'),a=e.target.closest('[data-action]'),t=e.target.closest('.toggle');if(r)route(r.dataset.route);if(a)openModal(a.dataset.action);if(t)t.classList.toggle('on')});$('#drawer').onclick=e=>{if(e.target.id==='drawer')$('#drawer').classList.remove('open')};$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};$('#search')?.addEventListener('keydown',e=>{if(e.key==='Enter'){openModal('invite');$('#modalTitle').textContent='Global command search';$('#modalBody').innerHTML=`<p style="color:var(--mut);line-height:1.5;margin-top:0">Prototype command result for: <strong>${e.target.value||'all host records'}</strong></p><div class="grid"><button class="listing" data-route="applicants"><div class="avatar">AB</div><div><h3>Ava Brooks</h3><p>Applicant • Farm Stay Operations • 94% match</p></div><span class="pill live">Open</span></button><button class="listing" data-route="listings"><div class="avatar alt">🎯</div><div><h3>Farm Stay Operations Assistant</h3><p>Listing • 12 applicants • live boosted</p></div><span class="pill live">Open</span></button></div>`}});if(location.hash)route(location.hash.slice(1));
</script>
</body></html>
