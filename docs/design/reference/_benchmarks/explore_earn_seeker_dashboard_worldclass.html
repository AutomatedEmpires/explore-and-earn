<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore&Earn — Seeker Dashboard Vision</title>
  <style>
    :root {
      --bg: #07120f;
      --bg2: #0b1914;
      --panel: rgba(255, 255, 255, 0.075);
      --panel2: rgba(255, 255, 255, 0.11);
      --paper: #f7f0df;
      --paper2: #eee4cf;
      --ink: #10201b;
      --text: #f6fff8;
      --muted: rgba(246,255,248,.67);
      --line: rgba(255,255,255,.15);
      --darkLine: rgba(16,32,27,.14);
      --emerald: #36f49c;
      --mint: #bbffd7;
      --aqua: #6deaff;
      --gold: #ffd66d;
      --coral: #ff7b61;
      --violet: #b987ff;
      --teal: #2d7588;
      --blue: #5bbcff;
      --shadow: 0 32px 90px rgba(0,0,0,.34);
      --softShadow: 0 18px 54px rgba(0,0,0,.22);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --side: 286px;
      --top: 76px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 0%, rgba(54,244,156,.20), transparent 35%),
        radial-gradient(circle at 88% 12%, rgba(109,234,255,.13), transparent 32%),
        radial-gradient(circle at 80% 92%, rgba(255,214,109,.10), transparent 32%),
        linear-gradient(135deg, #06100d, #0b1914 48%, #07120f);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .075;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 1;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: var(--side) 1fr;
      min-height: 100svh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100svh;
      padding: 18px 14px;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.035)),
        rgba(7,18,15,.58);
      backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    .brand {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 26px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #062016;
      font-weight: 950;
      background:
        radial-gradient(circle at 33% 24%, #fff 0 8%, transparent 9%),
        conic-gradient(from 180deg, var(--emerald), var(--aqua), var(--gold), var(--emerald));
      box-shadow: 0 0 34px rgba(54,244,156,.32);
    }

    .brand strong {
      display: block;
      letter-spacing: -.05em;
      font-size: 1.12rem;
      line-height: .95;
    }

    .brand span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(246,255,248,.6);
      font-size: .78rem;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 900;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 0 0 rgba(54,244,156,.7);
      animation: pulse 1.9s infinite;
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 11px rgba(54,244,156,0); }
      100% { box-shadow: 0 0 0 0 rgba(54,244,156,0); }
    }

    .seeker-card {
      position: relative;
      padding: 14px;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      background:
        linear-gradient(to bottom, rgba(0,0,0,.04), rgba(0,0,0,.58)),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80");
      background-size: cover;
      background-position: center;
      min-height: 166px;
      box-shadow: var(--softShadow);
      isolation: isolate;
    }

    .seeker-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 74% 10%, rgba(255,255,255,.28), transparent 18%),
        linear-gradient(135deg, rgba(54,244,156,.16), rgba(45,117,136,.12));
      mix-blend-mode: screen;
      z-index: -1;
    }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: 11px;
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-weight: 950;
      color: #061d13;
      background: linear-gradient(135deg, var(--emerald), var(--gold));
      flex: 0 0 auto;
      box-shadow: 0 0 26px rgba(54,244,156,.18);
      border: 1px solid rgba(255,255,255,.26);
    }

    .avatar.alt { background: linear-gradient(135deg, var(--aqua), var(--violet)); color: white; }
    .avatar.coral { background: linear-gradient(135deg, var(--coral), var(--gold)); color: #2a0c05; }
    .avatar.ghost { background: rgba(255,255,255,.10); color: var(--text); border: 1px solid rgba(255,255,255,.12); }

    .avatar-row strong {
      display: block;
      letter-spacing: -.045em;
      line-height: .95;
      font-size: 1.16rem;
    }

    .avatar-row span {
      display: flex;
      align-items: center;
      gap: 5px;
      color: rgba(246,255,248,.68);
      font-size: .76rem;
      font-weight: 800;
      margin-top: 4px;
    }

    .profile-score {
      padding: 12px;
      border-radius: 24px;
      background: rgba(255,255,255,.065);
      border: 1px solid rgba(255,255,255,.12);
    }

    .profile-score-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 950;
      color: rgba(246,255,248,.58);
      margin-bottom: 9px;
    }

    .meter {
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      width: var(--w, 68%);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--emerald), var(--gold));
      box-shadow: 0 0 24px rgba(54,244,156,.28);
    }

    .nav-group-label {
      margin: 4px 10px 8px;
      color: rgba(246,255,248,.42);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-weight: 950;
    }

    .nav-list {
      display: grid;
      gap: 7px;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: none;
    }

    .nav-list::-webkit-scrollbar { display: none; }

    .nav-item {
      width: 100%;
      border: 1px solid transparent;
      color: rgba(246,255,248,.72);
      background: transparent;
      min-height: 48px;
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 19px;
      text-align: left;
      transition: .2s ease;
    }

    .nav-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.10);
      font-size: 1.08rem;
    }

    .nav-item strong {
      display: block;
      color: inherit;
      font-size: .94rem;
      letter-spacing: -.02em;
    }

    .nav-item small {
      color: rgba(246,255,248,.42);
      font-size: .72rem;
    }

    .nav-badge {
      min-width: 26px;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: rgba(246,255,248,.74);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      font-size: .72rem;
      font-weight: 950;
    }

    .nav-item:hover {
      background: rgba(255,255,255,.08);
      color: white;
      transform: translateX(2px);
    }

    .nav-item.active {
      background:
        radial-gradient(circle at 15% 20%, rgba(54,244,156,.24), transparent 40%),
        rgba(255,255,255,.10);
      border-color: rgba(54,244,156,.25);
      color: white;
      box-shadow: 0 18px 42px rgba(0,0,0,.2);
    }

    .nav-item.active .nav-icon {
      background: linear-gradient(135deg, var(--emerald), var(--gold));
      color: #071b12;
      border-color: transparent;
      box-shadow: 0 0 24px rgba(54,244,156,.24);
    }

    .main {
      min-width: 0;
      position: relative;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: var(--top);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      background: rgba(7,18,15,.55);
      backdrop-filter: blur(22px);
    }

    .search {
      position: relative;
      flex: 1;
      max-width: 700px;
    }

    .search input {
      width: 100%;
      height: 48px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.075);
      color: var(--text);
      border-radius: 999px;
      outline: none;
      padding: 0 48px 0 46px;
      box-shadow: inset 0 1px rgba(255,255,255,.05);
    }

    .search input::placeholder { color: rgba(246,255,248,.45); }

    .search::before {
      content: "⌘";
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(246,255,248,.46);
      font-weight: 900;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .icon-btn, .primary-btn, .ghost-btn, .small-btn {
      border: 1px solid rgba(255,255,255,.14);
      color: var(--text);
      background: rgba(255,255,255,.075);
      border-radius: 999px;
      min-height: 46px;
      padding: 0 16px;
      font-weight: 900;
      transition: .2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .icon-btn {
      width: 46px;
      padding: 0;
      font-size: 1.1rem;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--emerald), var(--gold));
      color: #061d13;
      border-color: transparent;
      box-shadow: 0 16px 36px rgba(54,244,156,.18);
    }

    .small-btn {
      min-height: 36px;
      padding: 0 12px;
      font-size: .82rem;
    }

    .ghost-btn:hover, .icon-btn:hover, .primary-btn:hover, .small-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.28);
    }

    .content {
      padding: 24px;
      max-width: 1480px;
      margin: 0 auto;
    }

    .view {
      display: none;
      animation: enter .46s ease both;
    }

    .view.active { display: block; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(18px) scale(.992); }
      to { opacity: 1; transform: none; }
    }

    .hero-board {
      position: relative;
      min-height: 430px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 42px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background:
        linear-gradient(90deg, rgba(7,18,15,.94) 0%, rgba(7,18,15,.70) 46%, rgba(7,18,15,.15) 100%),
        url("https://images.unsplash.com/photo-1486870591958-9b9d0d1dda99?auto=format&fit=crop&w=1800&q=85");
      background-size: cover;
      background-position: center;
      padding: 28px;
      isolation: isolate;
    }

    .hero-board::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 66% 34%, rgba(255,255,255,.28), transparent 18%),
        linear-gradient(105deg, transparent 0 35%, rgba(255,255,255,.12) 50%, transparent 65%);
      transform: translateX(-65%);
      animation: sheen 7s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes sheen {
      0%, 22% { transform: translateX(-70%); opacity: 0; }
      45%, 58% { opacity: .78; }
      85%, 100% { transform: translateX(70%); opacity: 0; }
    }

    .hero-board h1 {
      margin: 18px 0 12px;
      max-width: 760px;
      font-size: clamp(2.8rem, 6vw, 6.5rem);
      line-height: .88;
      letter-spacing: -.08em;
    }

    .gradient {
      background: linear-gradient(115deg, #fff, var(--mint) 35%, var(--aqua) 62%, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-board p {
      max-width: 630px;
      color: rgba(246,255,248,.72);
      line-height: 1.55;
      font-size: 1.08rem;
      margin: 0 0 22px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tiny-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--mint);
      background: rgba(54,244,156,.10);
      border: 1px solid rgba(54,244,156,.20);
      font-size: .72rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .floating-status {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: min(100% - 48px, 520px);
      padding: 16px;
      border-radius: 28px;
      background: rgba(7,18,15,.66);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(22px);
      box-shadow: 0 22px 70px rgba(0,0,0,.28);
    }

    .readiness {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .ready-pill {
      min-height: 42px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.07);
      color: rgba(246,255,248,.68);
      font-weight: 950;
      font-size: .85rem;
    }

    .ready-pill.active {
      background: linear-gradient(135deg, var(--emerald), var(--gold));
      color: #061d13;
      border-color: transparent;
      box-shadow: 0 12px 34px rgba(54,244,156,.22);
    }

    .journey-line {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .journey-node {
      position: relative;
      min-height: 76px;
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 20px;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.11);
    }

    .journey-node strong {
      display: block;
      font-size: 1.18rem;
      letter-spacing: -.04em;
    }

    .journey-node span {
      color: rgba(246,255,248,.58);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 950;
    }

    .journey-node.hot {
      background: linear-gradient(135deg, rgba(54,244,156,.20), rgba(255,214,109,.12));
      border-color: rgba(54,244,156,.20);
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two { grid-template-columns: 1fr 1fr; }
    .grid.three { grid-template-columns: repeat(3, 1fr); }
    .grid.four { grid-template-columns: repeat(4, 1fr); }
    .grid.main-split { grid-template-columns: 1.14fr .86fr; }
    .grid.left-split { grid-template-columns: .84fr 1.16fr; }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 26px 0 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.8rem);
      line-height: .95;
      letter-spacing: -.065em;
    }

    .section-title p {
      margin: 6px 0 0;
      color: rgba(246,255,248,.58);
      line-height: 1.45;
      max-width: 680px;
    }

    .card {
      position: relative;
      border: 1px solid rgba(255,255,255,.14);
      background:
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.045)),
        rgba(255,255,255,.045);
      border-radius: var(--radius-xl);
      box-shadow: var(--softShadow);
      overflow: hidden;
    }

    .card.pad { padding: 18px; }

    .card.paper {
      background:
        radial-gradient(circle at 10% 0%, rgba(255,214,109,.20), transparent 40%),
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(246,240,224,.93));
      color: var(--ink);
      border-color: rgba(16,32,27,.12);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .card-header h3 {
      margin: 0;
      letter-spacing: -.045em;
      line-height: 1;
      font-size: 1.26rem;
    }

    .card-header p {
      margin: 5px 0 0;
      color: rgba(246,255,248,.56);
      line-height: 1.4;
    }

    .paper .card-header p { color: rgba(16,32,27,.58); }

    .metric-card {
      padding: 18px;
      min-height: 154px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      isolation: isolate;
    }

    .metric-card::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      right: -42px;
      top: -42px;
      background: radial-gradient(circle, rgba(54,244,156,.18), transparent 68%);
      z-index: -1;
    }

    .metric-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: rgba(246,255,248,.62);
      font-size: .84rem;
      font-weight: 850;
    }

    .metric {
      font-size: 2.65rem;
      letter-spacing: -.075em;
      font-weight: 950;
      line-height: .92;
    }

    .trend {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      gap: 5px;
      color: var(--mint);
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(54,244,156,.08);
      border: 1px solid rgba(54,244,156,.16);
      font-size: .78rem;
      font-weight: 900;
    }

    .spark {
      height: 46px;
      display: flex;
      align-items: end;
      gap: 5px;
      margin-top: 12px;
    }

    .spark i {
      flex: 1;
      border-radius: 999px 999px 4px 4px;
      min-height: 10px;
      background: linear-gradient(180deg, var(--emerald), rgba(54,244,156,.20));
      animation: barIn .9s ease both;
    }

    @keyframes barIn {
      from { transform: scaleY(.15); opacity: .3; }
      to { transform: scaleY(1); opacity: 1; }
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      color: rgba(246,255,248,.68);
      font-size: .74rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .paper .tag {
      background: rgba(16,32,27,.055);
      border-color: rgba(16,32,27,.10);
      color: rgba(16,32,27,.68);
    }

    .job-card {
      min-height: 430px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.055);
      box-shadow: var(--softShadow);
      transition: .24s ease;
    }

    .job-card:hover {
      transform: translateY(-5px);
      border-color: rgba(54,244,156,.24);
      box-shadow: var(--shadow);
    }

    .job-image {
      height: 196px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .job-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.04), rgba(7,18,15,.82));
    }

    .job-badges {
      position: absolute;
      inset: 14px 14px auto;
      display: flex;

    .pin {

      width: 18px;
      height: 18px;
      border-radius: 50% 50% 50% 0;

      transform: rotate(-45deg);

      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #092015;
      top: 6px;
      left: 6px;

    .modal {

      z-index: 120;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(0,0,0,.54);
      backdrop-filter: blur(8px);

    .modal.open { display: grid; }

    .modal-card {
      width: min(100%, 760px);
      border-radius: 34px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,.18);

        radial-gradient(circle at 20% 0%, rgba(54,244,156,.16), transparent 36%),

    .x {

    @media (max-width: 1180px) {
      :root { --side: 250px; }

      .pipe-col { min-height: auto; }
      .calendar { grid-template-columns: repeat(2, 1fr); }
      .resume-stepper { grid-template-columns: repeat(2, 1fr); }

    @media (max-width: 900px) {

      .sidebar, .topbar { display: none; }
      .mobile-top, .mobile-bottom { display: flex; }

      .pipeline, .calendar, .resume-stepper {

    @media (max-width: 560px) {

      .drawer-panel { grid-template-columns: 1fr; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    function setRoute(id) {
      if (id === "more") {
        document.getElementById("drawer").classList.add("open");
        return;
      }

      const route = routes.find(r => r.id === id) ? id : "home";
      document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === route));
      document.querySelectorAll("[data-route]").forEach(el => {
        if (el.classList.contains("nav-item") || el.classList.contains("mobile-nav-btn") || el.parentElement?.classList.contains("dev-bench")) {
          el.classList.toggle("active", el.dataset.route === route);
        }
      });
      document.getElementById("drawer").classList.remove("open");
      window.location.hash = route;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openModal(type) {
      const modal = document.getElementById("modal");
      const title = document.getElementById("modalTitle");
      const body = document.getElementById("modalBody");

      if (type === "acceptOffer") {
        title.textContent = "Accept offer";
        body.innerHTML = `
          <p style="color:rgba(246,255,248,.70);line-height:1.5;margin-top:0;">Before accepting, confirm housing, schedule, start date, travel expectations, and the best host contact.</p>
          <div class="grid two">
            ${["Housing confirmed", "Schedule confirmed", "Start date confirmed", "Travel route planned"].map((x, i) => `
              <div class="settings-row">
                <div><strong>${x}</strong><div style="color:rgba(246,255,248,.54);font-size:.86rem;margin-top:3px;">Acceptance checklist.</div></div>
                <button class="toggle ${i < 2 ? "on" : ""}"></button>
              </div>
            `).join("")}
          </div>
          <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
            <button class="primary-btn">Accept and create trip</button>
            <button class="ghost-btn">Ask host first</button>
          </div>
        `;
      } else if (type === "message") {
        title.textContent = "Message host";
        body.innerHTML = `
          <div class="field full">
            <label>Message</label>
            <textarea>Hi, I wanted to follow up on my application and confirm the next step in the process.</textarea>
          </div>
          <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
            <button class="primary-btn">Send message</button>
            <button class="ghost-btn">Save draft</button>
          </div>
        `;
      } else {
        title.textContent = "Apply to role";
        body.innerHTML = `
          <p style="color:rgba(246,255,248,.70);line-height:1.5;margin-top:0;">Apply using your seeker profile and resume. Your current resume score is 68%; completing experience and skill tags may improve your odds.</p>
          <div class="form-grid">
            <div class="field">
              <label>Selected resume</label>
              <select><option>Avery Stone — Seasonal Resume</option></select>
            </div>
            <div class="field">
              <label>Availability</label>
              <select><option>Ready now</option><option>1 month</option><option>3 months</option></select>
            </div>
            <div class="field full">
              <label>Short note</label>
              <textarea>I’m interested in this role because it matches my farm, seasonal, and housing-supported work preferences.</textarea>
            </div>
          </div>
          <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
            <button class="primary-btn">Submit application</button>
            <button class="ghost-btn" data-route="resume">Improve resume first</button>
          </div>
        `;
      }

      modal.classList.add("open");
    }

    function wireEvents() {
      document.body.addEventListener("click", (e) => {
        const routeEl = e.target.closest("[data-route]");
        const actionEl = e.target.closest("[data-action]");
        const toggle = e.target.closest(".toggle");

        if (routeEl) setRoute(routeEl.dataset.route);
        if (actionEl) openModal(actionEl.dataset.action);
        if (toggle) toggle.classList.toggle("on");
      });

      document.getElementById("drawer").addEventListener("click", (e) => {
        if (e.target.id === "drawer") e.currentTarget.classList.remove("open");
      });

      document.getElementById("closeModal").addEventListener("click", () => {
        document.getElementById("modal").classList.remove("open");
      });

      document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target.id === "modal") e.currentTarget.classList.remove("open");
      });

      document.getElementById("globalSearch").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          openModal("apply");
          document.getElementById("modalTitle").textContent = "Global seeker search";
          document.getElementById("modalBody").innerHTML = `
            <p style="color:rgba(246,255,248,.70);line-height:1.5;margin-top:0;">Prototype command result for: <strong>${e.target.value || "all seeker records"}</strong></p>
            <div class="grid">
              <button class="mini-card" data-route="saved" style="text-align:left;color:var(--text);">
                <strong>Farm Stay Operations Assistant</strong>
                <p style="color:rgba(246,255,248,.58);">Saved job • 94% match • housing available</p>
              </button>
              <button class="mini-card" data-route="offers" style="text-align:left;color:var(--text);">
                <strong>Coastal Adventure Guide</strong>
                <p style="color:rgba(246,255,248,.58);">Offer received • compare decision</p>
              </button>
            </div>
          `;
        }
      });
    }

    renderNavs();
    renderAllViews();
    wireEvents();

    const initial = window.location.hash.replace("#", "");
    if (initial) setRoute(initial);
  </script>
