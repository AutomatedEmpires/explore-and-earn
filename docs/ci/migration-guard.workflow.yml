# STAGED WORKFLOW — not yet active.
#
# The implementation agent's token lacks the GitHub `workflows` permission
# and cannot write under .github/workflows/ (PUT returns
# 403 "Resource not accessible by integration"). An admin must install this
# file with:
#
#   git mv docs/ci/migration-guard.workflow.yml .github/workflows/migration-guard.yml
#   git commit -m "ci(workflows): add migration numbering integrity guard"
#
# Then add the `migration-guard` check to required status checks on main
# (see docs/ci/branch-protection-and-review-governance.md).
#
# Alternative with NO new workflow: append the guard to the existing
# `guardrails` script in root package.json so the already-required `verify`
# check runs it (see docs/ci/migration-prefix-guard.md § Enforcement).

name: Migration Guard

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

jobs:
  migration-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Check migration prefixes
        run: node tools/scripts/check-migration-prefixes.mjs
