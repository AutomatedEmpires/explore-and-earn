# Deploy database migrations to the PRODUCTION Supabase project.
#
# This is the pipeline that keeps production from drifting again: every
# migration merged to `main` under supabase/migrations/ is applied to the live
# database by `supabase db push`, which only runs versions not already recorded
# in supabase_migrations.schema_migrations. Idempotent — re-runs are no-ops.
#
# REQUIRED GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token (account → Access Tokens)
#   SUPABASE_DB_PASSWORD    the production project's database password
#   SUPABASE_PROJECT_ID     the project ref — "mamosbzcbigcclafhmmr"
#
# Optional hardening: define a GitHub Environment named `production` with a
# required reviewer so a human approves before any prod schema change applies.
# See docs/runbooks/db-migrations-ci.md.

name: Deploy Migrations to Production

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: read

# Never let two migration pushes race against the same database.
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch lets maintainers choose any ref. Never allow a branch
    # checkout to use production credentials or satisfy the Vercel gate.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Migration 094 is the one-time exception to the normal app-first rule.
      # It closes legacy claim/update/RLS authority before a skewed web binary
      # can cross the new invite refund boundary. Later migrations retain the
      # established app-first ordering once production already records 094.
      - name: Inspect production migration state
        id: migration_state
        run: |
          set -euo pipefail
          test -f supabase/migrations/094_host_seeker_discovery_bridge.sql
          supabase migration list --linked
          mapfile -t local_versions < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' |
              sort |
              sed -E 's/^([0-9]{3})_[a-z0-9_]+\.sql$/\1/'
          )
          if [[ "${#local_versions[@]}" -eq 0 ]] ||
             printf '%s\n' "${local_versions[@]}" | grep -Ev '^[0-9]{3}$' >/dev/null ||
             [[ -n "$(printf '%s\n' "${local_versions[@]}" | uniq -d)" ]]; then
            echo "Local migration filenames/versions were empty, malformed, or duplicated." >&2
            exit 1
          fi
          local_state="$(printf '%s\n' "${local_versions[@]}" | jq -Rsc 'split("\n")[:-1]')"
          state="$(supabase db query --linked --output json \
            "select version
               from supabase_migrations.schema_migrations
              order by version")"
          if ! jq -e '
            type == "array" and
            all(.[]; type == "object" and (.version | type) == "string") and
            ([.[].version] | length) == ([.[].version] | unique | length)
          ' <<<"$state" >/dev/null; then
            echo "Production migration-state response was ambiguous; refusing to choose rollout order." >&2
            exit 1
          fi
          remote_state="$(jq -c '[.[].version] | sort' <<<"$state")"
          migration_093_applied="$(jq -nr --argjson remote "$remote_state" '$remote | index("093") != null')"
          migration_094_applied="$(jq -nr --argjson remote "$remote_state" '$remote | index("094") != null')"
          if [[ "$migration_094_applied" == "false" && "$migration_093_applied" != "true" ]]; then
            echo "Migration 094 is absent but prerequisite 093 is also absent; refusing a multi-migration DB-first push." >&2
            exit 1
          fi
          if [[ "$migration_094_applied" == "false" ]]; then
            pending_state="$(jq -cn \
              --argjson local "$local_state" \
              --argjson remote "$remote_state" \
              '$local - $remote | sort')"
            if ! jq -e '. == ["094"]' <<<"$pending_state" >/dev/null; then
              echo "The one-time DB-first pending set is not exactly [\"094\"]: $pending_state" >&2
              echo "Refusing db push so neither an older gap nor a future migration bypasses app-first ordering." >&2
              exit 1
            fi
            echo "db_first_094=true" >>"$GITHUB_OUTPUT"
            echo "Migration 094 is pending; applying its authority fence before the web deployment gate."
          else
            echo "db_first_094=false" >>"$GITHUB_OUTPUT"
            echo "Migration 094 is already applied; retaining normal app-first ordering."
          fi

      - name: Push migration 094 before the web release
        if: steps.migration_state.outputs.db_first_094 == 'true'
        timeout-minutes: 20
        run: supabase db push

      - name: Verify migration 094 production authority immediately
        if: steps.migration_state.outputs.db_first_094 == 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          proof="$(supabase db query \
            --linked \
            --output json \
            --file tools/db-assert/sql/assert_production_launch.sql)"
          jq -e '
            length == 1 and
            .[0].migration_094_applied == true and
            .[0].host_seeker_discovery_contract_safe == true and
            .[0].launch_rpc_grants_safe == true and
            .[0].service_function_search_paths_pinned == true
          ' <<<"$proof" >/dev/null
          echo "Migration 094 catalog, ACL, and authority contract verified before waiting for Vercel."

      # Vercel and GitHub Actions begin independently after a main push. Once
      # the one-time 094 fence exists, this exact-SHA gate restores the normal
      # application-before-schema order for 095 and every later migration.
      - name: Wait for this commit's Vercel production deployment
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 210); do
            # Vercel's GitHub integration currently reports the deployment as
            # an exact-SHA commit status (context "Vercel"). It does not
            # consistently create a vercel[bot]-owned GitHub Deployment, so
            # relying on the Deployments API alone can wait until timeout even
            # after Production is Ready. Prefer the exact commit status and
            # retain the deployment lookup as a compatibility fallback.
            if ! combined_status="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"; then
              echo "GitHub commit status request failed on attempt ${attempt}; treating as transient and waiting." >&2
              combined_status='{"statuses":[]}'
            fi
            vercel_state="$(jq -r '
              [.statuses[] | select((.context | ascii_downcase) == "vercel")]
              | sort_by(.updated_at) | last | .state // "pending"
            ' <<<"$combined_status")"
            case "$vercel_state" in
              success)
                echo "Vercel production commit status succeeded for ${GITHUB_SHA}."
                break
                ;;
              failure|error)
                echo "Vercel production commit status ended in ${vercel_state}." >&2
                exit 1
                ;;
            esac

            if ! deployments="$(gh api "repos/${GITHUB_REPOSITORY}/deployments" \
              --method GET \
              -f sha="$GITHUB_SHA" \
              -f per_page=100)"; then
              echo "GitHub deployments API request failed on attempt ${attempt}; treating as transient and waiting." >&2
              deployments='[]'
            fi
            deployment_id="$(jq -r --arg sha "$GITHUB_SHA" '
              [.[] | select(
                .sha == $sha and
                (.environment | ascii_downcase) == "production" and
                .creator.login == "vercel[bot]"
              )] | sort_by(.created_at) | last | .id // empty
            ' <<<"$deployments")"

            if [[ -n "$deployment_id" ]]; then
              if ! statuses="$(gh api \
                "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses")"; then
                echo "GitHub deployment statuses API request failed for ${deployment_id} on attempt ${attempt}; treating as transient and waiting." >&2
                statuses='[]'
              fi
              # A successful deployment may later become "inactive" when a
              # newer main commit reaches Production. It still proves this
              # compatible application SHA landed before its migration.
              if jq -e 'any(.[]; .state == "success")' <<<"$statuses" >/dev/null; then
                state=success
              else
                state="$(jq -r '.[0].state // "pending"' <<<"$statuses")"
              fi
              case "$state" in
                success)
                  echo "Vercel production deployment ${deployment_id} succeeded."
                  break
                  ;;
                failure|error)
                  echo "Vercel production deployment ${deployment_id} ended in ${state}." >&2
                  exit 1
                  ;;
              esac
              echo "Vercel production deployment ${deployment_id} is ${state}; waiting."
            else
              echo "No matching Vercel production deployment yet; waiting."
            fi

            if [[ "$attempt" -eq 210 ]]; then
              echo "Timed out waiting for Vercel production deployment of ${GITHUB_SHA}." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify production runtime readiness
        timeout-minutes: 3
        env:
          PRODUCTION_HEALTH_URL: https://exploreandearn.com/api/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if response="$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --connect-timeout 5 \
              --max-time 10 \
              --retry 2 \
              --retry-delay 2 \
              --retry-connrefused \
              "$PRODUCTION_HEALTH_URL")" &&
              jq -e '
                type == "object" and
                .status == "ready" and
                .checks.database == "ok"
              ' <<<"$response" >/dev/null; then
              echo "Production runtime and public database query are ready."
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Production readiness probe did not become healthy; rollout failed." >&2
              exit 1
            fi
            echo "Production readiness probe is not healthy yet; waiting."
            sleep 5
          done

      - name: Push migrations after the web release
        if: steps.migration_state.outputs.db_first_094 != 'true'
        timeout-minutes: 20
        run: supabase db push

      - name: Verify production schema contract
        timeout-minutes: 5
        run: |
          set -euo pipefail
          proof="$(supabase db query \
            --linked \
            --output json \
            --file tools/db-assert/sql/assert_production_launch.sql)"
          jq -e '
            length == 1 and
            .[0].migration_077_applied == true and
            .[0].migration_091_applied == true and
            .[0].migration_092_applied == true and
            .[0].migration_093_applied == true and
            .[0].migration_094_applied == true and
            .[0].launch_functions_present == true and
            .[0].launch_rpc_grants_safe == true and
            .[0].application_submission_rpc_safe == true and
            .[0].application_submission_writes_closed == true and
            .[0].application_submission_guards_present == true and
            .[0].listing_media_ownership_contract_safe == true and
            .[0].resume_experience_identity_contract_safe == true and
            .[0].host_seeker_discovery_contract_safe == true and
            .[0].direct_profile_insert_closed == true and
            .[0].launch_constraints_valid == true and
            .[0].launch_triggers_enabled == true and
            .[0].community_bucket_listing_closed == true and
            .[0].service_function_search_paths_pinned == true
          ' <<<"$proof" >/dev/null
          echo "Production migrations 077/091/092/093/094 and launch schema contract verified."

      # The migration itself gates withdrawal from its final pre-COMMIT clock
      # write. Observe that durable epoch read-only; never bypass it in CI.
      - name: Wait for migration 094 authority drain
        timeout-minutes: 7
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            state="$(supabase db query --linked --output json \
              "select
                 count(*) = 1
                 and bool_and(
                   clock_timestamp() >= applied_at + interval '330 seconds'
                 ) as rollout_drain_complete
               from public.invite_authority_rollout_094")"
            if ! jq -e '
              type == "array" and
              length == 1 and
              (.[0].rollout_drain_complete | type) == "boolean"
            ' <<<"$state" >/dev/null; then
              echo "Migration 094 rollout epoch response was ambiguous." >&2
              exit 1
            fi
            if jq -e '.[0].rollout_drain_complete == true' <<<"$state" >/dev/null; then
              echo "Migration 094 authority drain is complete."
              break
            fi
            if [[ "$attempt" -eq 36 ]]; then
              echo "Migration 094 authority drain did not complete within 360 seconds." >&2
              exit 1
            fi
            echo "Migration 094 authority drain is still active; waiting."
            sleep 10
          done

      - name: Verify post-migration production runtime
        timeout-minutes: 3
        env:
          PRODUCTION_HEALTH_URL: https://exploreandearn.com/api/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if response="$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --connect-timeout 5 \
              --max-time 10 \
              --retry 2 \
              --retry-delay 2 \
              --retry-connrefused \
              "$PRODUCTION_HEALTH_URL")" &&
              jq -e '
                type == "object" and
                .status == "ready" and
                .checks.database == "ok"
              ' <<<"$response" >/dev/null; then
              echo "Post-migration production runtime and database are ready."
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Post-migration production readiness probe failed." >&2
              exit 1
            fi
            echo "Post-migration production readiness probe is not healthy yet; waiting."
            sleep 5
          done
