name: Codex Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codex-review-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  codex:
    name: Respond with Codex (GPT-4o)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: |
      github.actor != 'github-actions[bot]' &&
      (
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@codex') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@codex') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        )
      )

    steps:
      - name: Check for OPENAI_API_KEY
        id: check_key
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Post setup instructions (key missing)
        if: steps.check_key.outputs.has_key == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `> **@codex** — \`OPENAI_API_KEY\` is not configured in GitHub Actions secrets.\n>\n> To enable Codex reviews:\n> 1. Go to **Settings → Secrets and variables → Actions**\n> 2. Add secret: \`OPENAI_API_KEY\` with your OpenAI API key\n>\n> Once set, re-trigger with \`@codex\` in a new comment.`;
            if (context.eventName === 'issue_comment') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } else {
              await github.rest.pulls.createReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body,
                commit_id: context.payload.pull_request?.head?.sha,
                path: context.payload.comment?.path || '',
                position: context.payload.comment?.position || 1,
              });
            }

      - name: Checkout
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/checkout@v4

      - name: Get PR diff
        if: steps.check_key.outputs.has_key == 'true'
        id: diff
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const prNumber = context.issue.number;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 50,
            });
            return files
              .filter(f => f.status !== 'removed')
              .map(f => `### ${f.filename}\n\`\`\`diff\n${(f.patch || '(binary or no diff)').slice(0, 3000)}\n\`\`\``)
              .join('\n\n');

      - name: Run Codex review
        if: steps.check_key.outputs.has_key == 'true'
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIFF: ${{ steps.diff.outputs.result }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg diff "$DIFF" \
              --arg comment "$COMMENT_BODY" \
              '{
                model: "gpt-4o",
                max_tokens: 1500,
                messages: [
                  {
                    role: "system",
                    content: "You are a senior engineer reviewing a PR for Explore&Earn, a mobile-first lifestyle opportunity marketplace (pnpm monorepo, Next.js App Router, Clerk auth, Supabase/Postgres). Review for correctness, security (RLS, secrets hygiene, auth), TypeScript strictness, design token compliance, and production readiness. Be concise. Lead with VERDICT: APPROVE / REQUEST_CHANGES / COMMENT. Then list findings with severity (critical/major/minor)."
                  },
                  {
                    role: "user",
                    content: ("Triggered by: " + $comment + "\n\nDiff:\n" + $diff)
                  }
                ]
              }')")
          echo "response<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'])" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post review comment
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.review.outputs.response }}
        with:
          script: |
            const body = `**@codex review (GPT-4o)**\n\n${process.env.REVIEW}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
