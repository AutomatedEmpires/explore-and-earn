name: Database Security

# Deliberately unfiltered. This job used to run only when supabase/migrations or
# tools/db-assert changed, which meant the authorization suite could not see a
# regression introduced anywhere else -- a policy is data in the database, and a
# PR that never touches a .sql file can still change which rows a role reaches
# (a new grant applied out of band, a reverted migration, a merge that drops a
# policy). Payments make an unverified authorization model expensive, so the
# suite now runs against a real database on every pull request.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Start and rebuild local database
        run: |
          supabase start
          supabase db reset --local

      - name: Verify database security contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node tools/db-assert/assert-grants.mjs

      # Row-level and column-level authorization, exercised as the anon and
      # authenticated roles against the database that was just rebuilt from 001.
      # Kept as its own step so a failure here reads as "a refusal stopped
      # refusing" rather than as a grant-catalog drift.
      - name: Verify authorization matrix
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node tools/db-assert/assert-authorization.mjs

      # Migration 084's applicant bridge. Its own DO block runs only when the
      # migration is applied, so it cannot see a later migration widening
      # host_can_view_seeker or re-granting a projection to anon. This step
      # exercises the bridge against the rebuilt schema on every pull request.
      # Kept separate so a failure reads as "the applicant bridge stopped
      # refusing" rather than as general authorization drift.
      - name: Verify host applicant bridge
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node tools/db-assert/assert-applicant-bridge.mjs

      # The ONLY proof that revoke_listing_slot_purchase takes a paid allowance
      # back exactly once when Stripe redelivers a cancellation. It is a separate
      # runner because the defect only appears when two transactions OVERLAP, so
      # it drives two psql sessions and their interleaving — something none of
      # the single-script suites above can express. It ran in no workflow at all
      # until now, which meant the double-decrement fix was asserted nowhere that
      # a pull request could see.
      - name: Verify listing-slot revocation under concurrency
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node tools/db-assert/assert-listing-slot-concurrency.mjs

      # Migration 087's founding-host program. This is the only surface that
      # publishes a scarcity claim ("N of CAPACITY remain, until DATE"), so the
      # numbers a visitor reads and the numbers the database enforces have to be
      # the same numbers. Kept separate so a failure reads as "the scarcity claim
      # stopped being true" rather than as general authorization drift.
      - name: Verify founding-host program
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node tools/db-assert/assert-founding-host-program.mjs

      # Migration 088's interview scheduler is private application data with a
      # service-only mutation boundary. Exercise its RLS, exact RPC grants,
      # ownership checks, lifecycle triggers and transactional event outbox as
      # real database roles so a later migration cannot silently widen access.
      - name: Verify interview scheduling security and lifecycle
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node tools/db-assert/assert-interview-scheduling.mjs

      # A single SQL session cannot prove migration 088's per-seeker advisory
      # lock. Drive two overlapping psql transactions, observe the lock wait,
      # then prove one overlapping selection is rejected while an adjacent slot
      # remains legal.
      - name: Verify interview selection under concurrency
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node tools/db-assert/assert-interview-scheduling-concurrency.mjs

      # Migration 090 makes message persistence and its canonical notification
      # event one database transaction. Exercise real JWT role resolution,
      # direct-insert refusal, privileged-trigger coverage, body bounds, exact
      # event cardinality, and rollback when the outbox insert fails.
      - name: Verify atomic message delivery and outbox
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node tools/db-assert/assert-message-delivery-atomic.mjs

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
